name: Match head skin to Jill body
on:
  push:
    branches: [codex/jill-head-swap]
    paths: ['match_skin.py', '.github/workflows/match-skin.yml']
permissions:
  contents: read
  actions: read
jobs:
  match:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jill-head-hair-replaced
          path: prior
          run-id: 39200140777
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Blender
        run: |
          curl -fsSL --retry 3 https://download.blender.org/release/Blender4.5/blender-4.5.14-linux-x64.tar.xz -o blender.tar.xz
          echo '9ba871ff2ecd36526b77432745980b7e6664ecd0c7ca11c48849073dcfe06da3  blender.tar.xz' | sha256sum --check
          tar -xJf blender.tar.xz
      - name: Match skin and verify GLB
        run: |
          set -o pipefail
          mkdir -p skin-output
          ./blender-4.5.14-linux-x64/blender -b --factory-startup --python-exit-code 1 --python match_skin.py 2>&1 | tee skin-output/blender.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jill-skin-matched
          path: skin-output/
          retention-days: 3
